<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - SkillLoop</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='register_style.css') }}">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            Skill<span>Loop</span>
        </div>

        <a href="{{ url_for('home') }}" class="home-link">
            ← Back to Home
        </a>

    </nav>


    <!-- ================= REGISTER SECTION ================= -->

    <main class="register-section">

        <div class="register-card">

            <div class="register-header">

                <div class="register-icon">
                    🚀
                </div>

                <h1>Create Your SkillLoop Account</h1>

                <p>
                    Share what you know and learn something new.
                </p>

            </div>


            <!-- ================= REGISTER FORM ================= -->

            <form action="{{ url_for('register') }}" method="POST">

                <!-- Name -->

                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="input-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Skill I Can Teach -->

                <div class="input-group">

                    <label for="teach_skill">
                        I Can Teach
                    </label>

                    <select id="teach_skill" name="teach_skill" required>

                        <option value="" disabled selected>
                            Select a skill you know
                        </option>

                        <option value="python">
                            Python
                        </option>

                        <option value="web-development">
                            Web Development
                        </option>

                        <option value="java">
                            Java
                        </option>

                        <option value="c-cpp">
                            C / C++
                        </option>

                        <option value="javascript">
                            JavaScript
                        </option>

                        <option value="ui-ux">
                            UI / UX Design
                        </option>

                        <option value="graphic-design">
                            Graphic Design
                        </option>

                        <option value="video-editing">
                            Video Editing
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Skill I Want To Learn -->

                <div class="input-group">

                    <label for="learn_skill">
                        I Want To Learn
                    </label>

                    <select id="learn_skill" name="learn_skill" required>

                        <option value="" disabled selected>
                            Select a skill you want to learn
                        </option>

                        <option value="python">
                            Python
                        </option>

                        <option value="web-development">
                            Web Development
                        </option>

                        <option value="java">
                            Java
                        </option>

                        <option value="c-cpp">
                            C / C++
                        </option>

                        <option value="javascript">
                            JavaScript
                        </option>

                        <option value="ui-ux">
                            UI / UX Design
                        </option>

                        <option value="graphic-design">
                            Graphic Design
                        </option>

                        <option value="video-editing">
                            Video Editing
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Skill Level -->

                <div class="input-group">

                    <label for="skill_level">
                        Your Skill Level
                    </label>

                    <select id="skill_level" name="skill_level" required>

                        <option value="" disabled selected>
                            Select your level
                        </option>

                        <option value="beginner">
                            Beginner
                        </option>

                        <option value="intermediate">
                            Intermediate
                        </option>

                        <option value="advanced">
                            Advanced
                        </option>

                    </select>

                </div>


                <button type="submit" class="register-button">
                    Create Account →
                </button>

            </form>


            <div class="login-text">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Login
                </a>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 SkillLoop. All rights reserved.
        </p>

    </footer>

</body>

</html>
