<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SkillLoop</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='login_style.css') }}">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Skill<span>Loop</span>
        </div>

        <a href="{{ url_for('home') }}" class="home-link">
            ← Back to Home
        </a>

    </nav>


    <main class="login-section">

        <div class="login-card">

            <div class="login-header">

                <div class="login-icon">
                    🔐
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to continue your SkillLoop journey.
                </p>

            </div>


            <form action="{{ url_for('login') }}" method="POST">

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" class="login-button">
                    Login →
                </button>

            </form>


            <div class="register-text">

                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Create Account
                </a>

            </div>

        </div>

    </main>


    <footer>

        <p>
            © 2026 SkillLoop. All rights reserved.
        </p>

    </footer>

</body>

</html>
